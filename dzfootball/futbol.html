<!-- ================= WIDGET INTELIGENTE DZ FOOTBALL ================= -->
<style>
    /* Contenedor del Widget */
    .dz-widget-container {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 99999; /* Máxima prioridad visual */
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: 'Orbitron', 'Segoe UI', sans-serif;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        width: 120px;
        height: 120px;
        justify-content: center;
    }

    /* Anillo Holográfico de Giro */
    .dz-hud-ring {
        position: absolute;
        width: 105px;
        height: 105px;
        border: 2px dashed #00d2ff;
        border-radius: 50%;
        animation: rotateRing 10s linear infinite;
        opacity: 0.6;
        transition: all 0.3s ease;
        pointer-events: none;
    }

    /* Balón Flotante interactivo */
    .dz-interactive-ball {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
        cursor: pointer;
        z-index: 2;
        animation: floatBall 3s ease-in-out infinite;
        transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    /* Balón de Respaldo por Código (Garantiza que siempre aparezca algo) */
    .dz-ball-fallback {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #38bdf8 0%, #0369a1 50%, #0f172a 100%);
        border: 3px solid #ffffff;
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
        cursor: pointer;
        z-index: 2;
        animation: floatBall 3s ease-in-out infinite;
        transition: transform 0.4s ease, box-shadow 0.4s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 18px;
        color: #fff;
        text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    /* Botón X para cerrar */
    .dz-dismiss-btn {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 22px;
        height: 22px;
        background-color: #ef4444;
        color: white;
        border-radius: 50%;
        border: none;
        font-size: 11px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        z-index: 3;
        opacity: 0.8;
        transition: opacity 0.3s ease;
    }

    .dz-widget-container:hover .dz-hud-ring {
        opacity: 1;
        width: 115px;
        height: 115px;
        border-color: #22c55e;
    }

    .dz-widget-container:hover .dz-interactive-ball, 
    .dz-widget-container:hover .dz-ball-fallback {
        transform: scale(1.1) rotate(180deg);
        box-shadow: 0 0 35px rgba(34, 197, 94, 0.9);
    }

    @keyframes floatBall {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
    }
    @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* --- VENTANA MODAL DEL JUEGO --- */
    .dz-game-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(3, 7, 18, 0.9);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        z-index: 999999;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
    }

    .dz-game-modal.active {
        opacity: 1;
        pointer-events: auto;
    }

    .dz-console-box {
        position: relative;
        width: 90%;
        max-width: 1040px;
        background: #090d16;
        border: 2px solid #22c55e;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 0 50px rgba(34, 197, 94, 0.3);
        transform: scale(0.85);
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .dz-game-modal.active .dz-console-box {
        transform: scale(1);
    }

    .dz-console-header {
        background: #030712;
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .dz-console-title {
        font-weight: 900;
        letter-spacing: 2px;
        color: #22c55e;
        font-size: 1rem;
    }

    .dz-close-console {
        background: none;
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 5px 15px;
        border-radius: 4px;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .dz-close-console:hover {
        background-color: #ef4444;
        border-color: #ef4444;
    }

    .dz-iframe-container {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
    }

    .dz-iframe-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
    }
</style>

<!-- Componente del Widget -->
<div class="dz-widget-container" id="dzWidget">
    <button class="dz-dismiss-btn" onclick="dismissWidget(event)">X</button>
    <div class="dz-hud-ring"></div>
    
    <!-- Intentar cargar la imagen en las 2 ubicaciones más probables -->
    <img src="balon.png" 
         onerror="this.src='futbol/balon.png'; this.onerror=function(){this.style.display='none'; document.getElementById('dzBallFallback').style.display='flex';}" 
         class="dz-interactive-ball" 
         onclick="openGameModal()">

    <!-- Balón 3D de respaldo si la imagen falla en cargar -->
    <div id="dzBallFallback" class="dz-ball-fallback" style="display:none;" onclick="openGameModal()">
        DZ
    </div>
</div>

<!-- Modal que renderiza el juego -->
<div class="dz-game-modal" id="dzGameModal">
    <div class="dz-console-box">
        <div class="dz-console-header">
            <span class="dz-console-title">DZ FOOTBALL - EN VIVO</span>
            <button class="dz-close-console" onclick="closeGameModal()">CERRAR [X]</button>
        </div>
        <div class="dz-iframe-container">
            <iframe id="dzGameIframe" src="" allow="autoplay"></iframe>
        </div>
    </div>
</div>

<script>
    function openGameModal() {
        const modal = document.getElementById('dzGameModal');
        const iframe = document.getElementById('dzGameIframe');
        
        // Verifica si tu archivo index del juego está en la carpeta raiz o en "futbol/"
        iframe.src = 'index.html'; // Intenta cargar primero local
        
        // Si el archivo está en subcarpeta "futbol/", cámbialo a: iframe.src = 'futbol/index.html';
        
        modal.classList.add('active');
    }

    function closeGameModal() {
        const modal = document.getElementById('dzGameModal');
        const iframe = document.getElementById('dzGameIframe');
        modal.classList.remove('active');
        iframe.src = ''; 
    }

    function dismissWidget(event) {
        event.stopPropagation();
        document.getElementById('dzWidget').style.display = 'none';
    }
</script>
<!-- ================= FIN WIDGET PREMIUM DZ FOOTBALL ================= -->
